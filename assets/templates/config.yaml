input:
  samples_tsv: null
  reference_genome: null
  reference_index_dir: null
  include_bed: null
  exclude_bed: null
  format: "fastq"
  reads_type: "pe"

output:
  directory: "ChoCallate_output"
  type: "single"
  format: "bcf"
  remove_invariant: true
  split_multiallelic: false

ref_genome:
  bgzip: true

mapping:
  mapper: "bowtie2"
  extra_args: ""
  cpu: 10

bam_filter:
  min_map_qual: 0

rmdup:
  enabled: false

left_align_indels:
  enabled: true

coverage:
  min_coverage: 2

calling:
  callers: "bcftools,gatk,freebayes"
  cpu: 4
  allow_caller_failure: false
  bcftools:
    min_snp_qual: 20
    min_indel_qual: 20
    call:
      extra_args: ""
    mpileup:
      extra_args: ""
  freebayes:
    min_snp_qual: 20
    min_indel_qual: 20
    extra_args: ""
  gatk:
    min_snp_qual: 20
    min_indel_qual: 20
    extra_args: ""

consensus:
  threshold: 2
  cpu: 4
  absent_vote: "ref"
  tie_policy: "nocall"
