input:
  samples_tsv: null
  reference_genome: null
  reference_index_dir: null
  custom_bed: null
  format: "fastq"
  reads_type: "pe"

output:
  directory: "ChoCallate_output"
  type: "sample"
  format: "bcf"

ref_genome:
  bgzip: true

mapping:
  mapper: "bowtie2"
  extra_args: ""
  cpu: 10

bam_filter:
  min_map_qual: 0

rmdup:
  enabled: false

left_align_indels:
  enabled: true

coverage:
  min_coverage: 3

calling:
  callers: "bcftools,gatk,freebayes,vardict,mutect2"
  min_base_quality: 0
  min_snp_qual: 20
  cpu: 4
  bcftools:
    call:
      extra_args: "--multiallelic-caller --variants-only"
    mpileup:
      extra_args: "--count-orphans"
  freebayes:
    extra_args: "--hwe-priors-off --no-population-priors"
  gatk:
    extra_args: "--do-not-run-physical-phasing true --smith-waterman FASTEST_AVAILABLE --create-output-variant-index false --native-pair-hmm-threads 1"
  vardict:
    extra_args: "--nosv"
  mutect2:
    extra_args: "--smith-waterman FASTEST_AVAILABLE --create-output-variant-index false --native-pair-hmm-threads 1"

consensus:
  threshold: null
  cpu: 4
