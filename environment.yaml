name: ChoCallate
channels:
  - conda-forge
  - bioconda
dependencies:
  - bwa=0.7.19
  - minimap2=2.31
  - bowtie2=2.5.5
  - freebayes=1.3.10
  - bcftools=1.24
  - gatk4=4.6.2.0
  - samtools=1.24
  - mosdepth=0.3.14
  - htslib=1.24
  # pysam has no free-threaded build, so keep the GIL-enabled CPython build.
  - python=3.13.16=*_cp313
  - bedops=2.4.42
  - nextflow=26.10.2
  - parallel=20260922
  - pysam=0.24.1
  # test suite (tests/python, run with `pytest -q tests/python`)
  - pytest=9.1.1
  - nf-test=0.9.5
  - ruff=0.17.1
  - actionlint=1.7.12
  - picard=3.5.0
  # build dependencies of the optional consensus accelerator
  # (bin/build_consensus_accel.py)
  - cython=3.3.0
  - setuptools=84.1.0
  - c-compiler=2.0.0
